[package]
name = "statify-string-to-word"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Inti pemrosesan teks (library murni, dipakai bersama NB v2 / AM v2)
statify-text-core = { path = "../../../../../public/workers/TextAnalytics/statify-text-core" }

wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
serde_json = "1.0"

# Stemming bahasa Inggris (Porter algorithm)
rust-stemmers = "1.2.0"

# Stemming bahasa Indonesia (Nazief-Adriani via Sastrawi)
sastrawi-rs = "0.5.1"

# HashSet & HashMap efisien untuk stopwords filter
hashbrown = "0.14"

# Regex engine untuk tokenizer
regex = "1.10"

# Menampilkan Rust panic() di browser DevTools (wajib untuk debugging WASM)
console_error_panic_hook = { version = "0.1", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[features]
default = ["console_error_panic_hook"]
