[package]
name = "wasm"
version = "0.1.0"
edition = "2021"
description = "Project Rust-Wasm Statify - Apply Model."
repository = "https://git.stis.ac.id/"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Fase 6 (PLAN.md Bagian C): dependency awal hanya yang dipakai scaffold +
# wasm dummy (parsing payload lewat serde/wasm-bindgen, JSON statis).
# Dependency identik dengan crate Naive Bayes (`naive-bayes/rust/Cargo.toml`)
# sesuai kontrak AGENTS.md §7.1.
[dependencies]
js-sys = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.140"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }

# Revisi v2 (AGENTS_V2.md V13, pengecualian aturan salin P6): mesin teks tunggal.
# Preprocessing (`transform` dengan resep) dan likelihood Text (`nb_text`) HANYA
# lewat crate ini supaya skor Apply Model identik dengan Naive Bayes.
# Path sama dengan `naive-bayes/rust/Cargo.toml`.
statify-text-core = { path = "../../../../../../public/workers/TextAnalytics/statify-text-core" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
